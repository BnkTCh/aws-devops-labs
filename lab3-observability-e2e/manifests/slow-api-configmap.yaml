# Código de la API problemática (montado via ConfigMap)
apiVersion: v1
kind: ConfigMap
metadata:
  name: slow-api-code
  namespace: demo-observability
data:
  server.py: |
    """
    Slow API - Simula una API con problemas de performance.
    
    Comportamiento:
    - GET /health: siempre 200 (health check)
    - GET /api/data: respuesta normal (~100ms)
    - GET /api/process: 30% lento (3-8s), 20% error 500, 50% normal
    - GET /api/heavy: simula memory leak (crece con cada request)
    - POST /api/order: simula processing con errores intermitentes
    """
    import http.server
    import json
    import time
    import random
    import threading
    from datetime import datetime

    # Simular memory leak
    memory_leak = []
    request_count = 0
    error_count = 0
    start_time = datetime.now()

    class DemoHandler(http.server.BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            # Log en formato que Container Insights puede capturar
            print(f"[{datetime.now().isoformat()}] {self.address_string()} - {format % args}")

        def send_json(self, status_code, data):
            self.send_response(status_code)
            self.send_header('Content-Type', 'application/json')
            self.end_headers()
            self.wfile.write(json.dumps(data).encode())

        def do_GET(self):
            global request_count, error_count, memory_leak

            request_count += 1

            if self.path == '/health':
                self.send_json(200, {'status': 'healthy', 'uptime': str(datetime.now() - start_time)})

            elif self.path == '/api/data':
                # Endpoint normal - siempre rápido
                time.sleep(random.uniform(0.05, 0.15))
                self.send_json(200, {
                    'data': [{'id': i, 'value': f'item_{i}'} for i in range(10)],
                    'latency_ms': random.randint(50, 150)
                })

            elif self.path == '/api/process':
                # Endpoint problemático - simula degradación
                roll = random.random()

                if roll < 0.3:
                    # Latencia alta - simula query lenta a DB
                    delay = random.uniform(3.0, 8.0)
                    time.sleep(delay)
                    print(f"[WARN] Slow response: {delay:.1f}s - possible DB connection pool exhaustion")
                    self.send_json(200, {
                        'result': 'processed (slow)',
                        'latency_ms': int(delay * 1000),
                        'warning': 'high_latency'
                    })

                elif roll < 0.5:
                    # Error 500 - simula crash
                    error_count += 1
                    error_msg = random.choice([
                        'DatabaseConnectionError: Cannot connect to RDS. Pool exhausted (100/100)',
                        'TimeoutError: Upstream service did not respond within 5000ms',
                        'OutOfMemoryError: Java heap space exceeded in worker thread',
                        'ConnectionResetError: Redis connection lost during transaction'
                    ])
                    print(f"[ERROR] {error_msg}")
                    self.send_json(500, {
                        'error': 'Internal Server Error',
                        'message': error_msg,
                        'request_id': f'req-{request_count:06d}',
                        'timestamp': datetime.now().isoformat()
                    })

                else:
                    # Normal
                    time.sleep(random.uniform(0.1, 0.3))
                    self.send_json(200, {
                        'result': 'processed',
                        'latency_ms': random.randint(100, 300)
                    })

            elif self.path == '/api/heavy':
                # Simula memory leak - cada request consume más memoria
                chunk = 'x' * random.randint(10000, 50000)
                memory_leak.append(chunk)
                current_mb = sum(len(s) for s in memory_leak) / 1024 / 1024

                if current_mb > 100:
                    # Reset para no crashear el pod realmente
                    memory_leak.clear()
                    print(f"[CRITICAL] Memory usage exceeded threshold: {current_mb:.1f}MB - performing emergency GC")

                self.send_json(200, {
                    'result': 'heavy_operation_complete',
                    'memory_used_mb': f'{current_mb:.2f}',
                    'leak_entries': len(memory_leak)
                })

            elif self.path == '/metrics':
                # Endpoint de métricas para debugging
                self.send_json(200, {
                    'total_requests': request_count,
                    'total_errors': error_count,
                    'error_rate': f'{(error_count/max(request_count,1))*100:.1f}%',
                    'uptime': str(datetime.now() - start_time),
                    'memory_leak_entries': len(memory_leak)
                })

            else:
                self.send_json(404, {'error': 'Not Found', 'path': self.path})

        def do_POST(self):
            global request_count, error_count
            request_count += 1

            if self.path == '/api/order':
                # Simula procesamiento de orden con errores intermitentes
                content_length = int(self.headers.get('Content-Length', 0))
                body = self.rfile.read(content_length) if content_length > 0 else b'{}'

                roll = random.random()
                if roll < 0.25:
                    error_count += 1
                    print(f"[ERROR] Order processing failed: Payment gateway timeout")
                    self.send_json(503, {
                        'error': 'Service Unavailable',
                        'message': 'Payment gateway timeout after 30000ms',
                        'retry_after': 5
                    })
                else:
                    time.sleep(random.uniform(0.2, 1.0))
                    self.send_json(201, {
                        'order_id': f'ORD-{random.randint(10000, 99999)}',
                        'status': 'confirmed',
                        'processing_time_ms': random.randint(200, 1000)
                    })
            else:
                self.send_json(404, {'error': 'Not Found'})

    if __name__ == '__main__':
        server = http.server.HTTPServer(('0.0.0.0', 8080), DemoHandler)
        print(f"[INFO] Slow API starting on port 8080")
        print(f"[INFO] Endpoints: /health, /api/data, /api/process, /api/heavy, /api/order, /metrics")
        server.serve_forever()
