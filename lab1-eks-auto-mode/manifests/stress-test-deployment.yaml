# Deployment de carga para demostrar auto-scaling agresivo
# Usa esto DESPUÉS del demo básico para mostrar cómo Auto Mode escala
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress-demo
  labels:
    app: stress-demo
spec:
  replicas: 20
  selector:
    matchLabels:
      app: stress-demo
  template:
    metadata:
      labels:
        app: stress-demo
    spec:
      containers:
      - name: busybox
        image: busybox:1.36
        command: ["sh", "-c", "while true; do echo 'working...'; sleep 10; done"]
        resources:
          requests:
            cpu: "200m"
            memory: "128Mi"
          limits:
            cpu: "400m"
            memory: "256Mi"
